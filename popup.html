<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Reply Guy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 380px;
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f8f9f8;
      color: #111111;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      background: #111111;
      color: #fff;
      padding: 18px 16px 16px;
      border-bottom: 1px solid #222;
    }
    .header h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h2 span { font-weight: 400; opacity: 0.7; font-size: 12px; letter-spacing: 0; }
    .header p {
      margin: 6px 0 0;
      font-size: 12px;
      color: #9ca3af;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .body { padding: 14px 14px 12px; }
    .label {
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      margin: 0 0 8px;
    }
    .tweet {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.6;
      max-height: 110px;
      overflow: auto;
      white-space: pre-wrap;
      color: #1f2937;
    }
    .tweet:empty::before { content: "No tweet detected"; color: #9ca3af; }
    details#manualWrap {
      margin-top: 10px;
      background: #fff;
      border: 1px dashed #d1d5db;
      border-radius: 10px;
      padding: 8px 10px;
    }
    details#manualWrap summary {
      cursor: pointer;
      font-size: 12px;
      color: #4b5563;
      font-weight: 500;
    }
    #manual {
      width: 100%;
      margin-top: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }
    #manual:focus { border-color: #111111; }
    #useManual {
      margin-top: 8px;
      width: 100%;
      padding: 7px;
      border: 1px solid #111111;
      border-radius: 8px;
      background: #111111;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    #useManual:hover { background: #222; }
    .styles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 14px 0 12px;
    }
    .styles button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 6px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #1f2937;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 550;
      letter-spacing: -0.01em;
      transition: all 0.12s ease;
    }
    .styles button:hover {
      border-color: #111111;
      background: #111111;
      color: #fff;
      transform: translateY(-1px);
    }
    .styles button:active { transform: translateY(0); }
    .out { font-size: 13px; }
    .item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 8px;
      transition: border-color 0.12s;
    }
    .item:hover { border-color: #9ca3af; }
    .item-text { white-space: pre-wrap; line-height: 1.6; color: #111111; font-size: 13px; }
    .item-actions { display: flex; gap: 6px; margin-top: 10px; }
    .item-actions button {
      flex: 1;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.12s;
    }
    .item-actions button:first-child {
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #374151;
    }
    .item-actions button:first-child:hover { background: #f9fafb; border-color: #111111; }
    .item-actions button:last-child {
      border: 1px solid #111111;
      background: #111111;
      color: #fff;
    }
    .item-actions button:last-child:hover { background: #222; }
    .stream {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px 12px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: #374151;
      font-size: 13px;
    }
    .hint { color: #6b7280; font-size: 11.5px; line-height: 1.5; }
    .footer {
      padding: 10px 14px 14px;
      border-top: 1px solid #e5e7eb;
      background: #fff;
    }
    .footer a { color: #111111; text-decoration: underline; text-underline-offset: 2px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <h2>X Reply Guy <span>— growth replies</span></h2>
    <p>Turn any tweet into high-engagement replies</p>
  </div>
  <div class="body">
    <div class="label">Current tweet</div>
    <div id="tweet" class="tweet">Reading current tweet…</div>
    <details id="manualWrap" style="display:none">
      <summary>Auto-detect failed? Paste the tweet manually</summary>
      <textarea id="manual" rows="3" placeholder="Paste the tweet text here…"></textarea>
      <button id="useManual">Use this text</button>
    </details>
    <div class="label" style="margin-top:14px">Reply style</div>
    <div class="styles">
      <button data-s="value">Value</button>
      <button data-s="question">Question</button>
      <button data-s="hot">Hot take</button>
      <button data-s="witty">Witty</button>
      <button data-s="agree">Relate</button>
      <button data-s="data">Data</button>
      <button data-s="story">Story</button>
      <button data-s="contrarian">Pushback</button>
      <button data-s="devout">Devout</button>
      <button data-s="sincere">Sincere</button>
    </div>
    <div id="out" class="out"><span class="hint">Pick a style to generate 3 reply candidates.</span></div>
  </div>
  <div class="footer hint">Click <b>Copy</b> to copy or <b>Fill</b> to insert into X. Set your API key in <a href="#" id="opt">Options</a> first.</div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
